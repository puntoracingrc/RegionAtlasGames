name: eBay global regional campaign

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Juegos a consultar (1-250)"
        required: false
        default: "25"
        type: string
      dry_run:
        description: "Solo mostrar el siguiente lote"
        required: false
        default: false
        type: boolean

concurrency:
  group: price-data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run resumable global campaign
        id: campaign
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BATCH_SIZE="${{ inputs.batch_size || '50' }}"
          ARGS=(--batch-size "$BATCH_SIZE" --per-game 8 --delay 0.5)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          else
            [[ -n "$EBAY_CLIENT_ID" && -n "$EBAY_CLIENT_SECRET" ]] || {
              echo "Faltan EBAY_CLIENT_ID o EBAY_CLIENT_SECRET." >&2
              exit 1
            }
            [[ -n "$OPENAI_API_KEY" ]] || {
              echo "Falta OPENAI_API_KEY; la campaña exige validar la edición antes de publicar precios." >&2
              exit 1
            }
          fi
          python3 scripts/run_ebay_regional_campaign.py "${ARGS[@]}"

      - name: Validate campaign state and regional policy
        if: inputs.dry_run != true
        run: |
          python3 scripts/test_ebay_region_policy.py
          python3 scripts/test_ebay_regional_routing.py
          python3 scripts/test_ebay_regional_campaign.py

      - name: Commit campaign progress
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog.json \
            data/ebay-regional-campaigns \
            data/meta.json \
            data/price-history.json \
            data/price-sync-state.json
          if git diff --staged --quiet; then
            echo "Sin cambios de campaña."
            exit 0
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main cambió durante el lote; no se fuerza una mezcla de datos." >&2
            exit 1
          fi
          git commit -m "chore(prices): advance global eBay regional campaign"
          git push origin HEAD:main
