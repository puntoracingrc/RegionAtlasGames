name: eBay global regional campaign

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Juegos máximos a considerar por tanda (1-250)"
        required: false
        default: "250"
        type: string
      dry_run:
        description: "Solo mostrar el siguiente lote"
        required: false
        default: false
        type: boolean

concurrency:
  group: price-data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load approved collector intelligence
        env:
          LEARNING_URL: https://www.puntoracing.net/MEDIAREGIONATLAS/price-worker/app/data/admin/collector-learning.json
        run: |
          LEARNING_FILE="$RUNNER_TEMP/collector-learning.json"
          if ! curl --fail --silent --show-error --retry 2 \
            -H "Cache-Control: no-cache" \
            "$LEARNING_URL?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$LEARNING_FILE"; then
            printf '{"schemaVersion":1,"policyVersion":"collector-intelligence-v1","games":{}}\n' > "$LEARNING_FILE"
          fi
          python3 -m json.tool "$LEARNING_FILE" >/dev/null
          echo "PRICE_COLLECTOR_LEARNING_FILE=$LEARNING_FILE" >> "$GITHUB_ENV"

      - name: Run resumable global campaign
        id: campaign
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BATCH_SIZE="${{ inputs.batch_size || '250' }}"
          ARGS=(--batch-size "$BATCH_SIZE" --search-budget "$BATCH_SIZE" --per-game 8 --delay 0.5)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          else
            [[ -n "$EBAY_CLIENT_ID" && -n "$EBAY_CLIENT_SECRET" ]] || {
              echo "Faltan EBAY_CLIENT_ID o EBAY_CLIENT_SECRET." >&2
              exit 1
            }
            [[ -n "$OPENAI_API_KEY" ]] || {
              echo "Falta OPENAI_API_KEY; la campaña exige validar la edición antes de publicar precios." >&2
              exit 1
            }
          fi
          python3 scripts/run_ebay_regional_campaign.py "${ARGS[@]}"

      - name: Validate campaign state and regional policy
        if: inputs.dry_run != true
        run: |
          python3 scripts/test_ebay_region_policy.py
          python3 scripts/test_ebay_regional_routing.py
          python3 scripts/test_ebay_regional_campaign.py

      - name: Commit campaign progress
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog.json \
            data/ebay-regional-campaigns \
            data/meta.json \
            data/price-history.json \
            data/price-sync-state.json
          if git diff --staged --quiet; then
            echo "Sin cambios de campaña."
            exit 0
          fi
          git commit -m "chore(prices): advance global eBay regional campaign"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Los datos de main cambiaron de forma incompatible; no se fuerza la mezcla." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main avanzó durante el push; reintentando ($attempt/3)." >&2
            sleep 5
          done
          echo "No se pudo publicar el lote tras tres reintentos seguros." >&2
          exit 1
