name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: PS1 cover backlog tests
        run: python3 scripts/test_ps1_cover_backlog.py

      - name: PS2 regional catalog and documentary contract
        run: |
          node --test scripts/test-prepare-vercel-build.mjs
          npx tsx --test src/lib/ps2-regional.test.ts
          python3 scripts/ps2-regional/verify.py
          python3 scripts/ps2-regional/verify_reproducibility.py
          python3 scripts/test_ps2_documentary.py

      - name: Scanner tests
        run: npm run test:scanner

      - name: Collector safety tests
        run: |
          npm run test:collector-controls
          python3 scripts/test_ai_usage.py
          python3 scripts/test_ebay_review_inbox.py
          python3 scripts/test_region_research.py
          python3 scripts/test_region_vision_components.py
          python3 scripts/test_reviewed_regional_learning.py
          npx tsx --test src/lib/ebay-review-inbox.test.ts

      - name: Affiliate offer tests
        run: npm run test:affiliate-offers-v1

      - name: Production build
        run: npm run build
