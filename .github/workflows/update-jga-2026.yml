name: Update Japan Game Awards 2026

on:
  push:
    branches:
      - codex/japan-game-awards-2026
    paths:
      - .github/workflows/update-jga-2026.yml

permissions:
  contents: write

jobs:
  update-awards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: codex/japan-game-awards-2026

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add reviewed 2026 results to deterministic award source
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const seedPath = 'data/research/award-study/backfill-v1.json';
          const metadataPath = 'data/research/award-study/series-metadata.json';
          const preparePath = 'scripts/prepare-awards-v1.ts';

          const seed = JSON.parse(fs.readFileSync(seedPath, 'utf8'));
          seed.currentResults = [
            {
              series: 'japan-game-awards', year: 2026, title: 'Pokémon Pokopia',
              categorySlug: 'grand-award', categoryName: 'Grand Award', categoryType: 'top_game', resultType: 'winner',
              url: 'https://awards.cesa.or.jp/en/year/prize/01.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: '文字遊戯',
              categorySlug: 'game-designers-award', categoryName: 'Game Designers Award', categoryType: 'game_design', resultType: 'winner',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'イナズマイレブン 英雄たちのヴィクトリーロード',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'カービィのエアライダー',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'Ghost of Yōtei',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'SILENT HILL f',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'デジモンストーリー タイムストレンジャー',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'DEATH STRANDING 2: ON THE BEACH',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'ドンキーコング バナンザ',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'バイオハザード レクイエム',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'パラノマサイト FILE38 伊勢人魚物語',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'PRAGMATA',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'Pokémon Pokopia',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/en/year/prize/01.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: '魔法少女ノ魔女裁判',
              categorySlug: 'award-for-excellence', categoryName: 'Award for Excellence', categoryType: 'other', resultType: 'recipient',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'PRAGMATA',
              categorySlug: 'breakthrough-award', categoryName: 'Breakthrough Award', categoryType: 'innovation', resultType: 'winner',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'めっちゃカメレオン',
              categorySlug: 'movement-award', categoryName: 'Movement Award', categoryType: 'special', resultType: 'winner',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'game', retrievedAt: '2026-09-16'
            },
            {
              series: 'japan-game-awards', year: 2026, title: 'ザ・スーパーマリオギャラクシー・ムービー',
              categorySlug: 'special-award', categoryName: 'Special Award', categoryType: 'special', resultType: 'special_recognition',
              url: 'https://awards.cesa.or.jp/year/prize/index.html', recipientType: 'other', recipientKey: 'the-super-mario-galaxy-movie', retrievedAt: '2026-09-16'
            }
          ];
          fs.writeFileSync(seedPath, JSON.stringify(seed, null, 2) + '\n');

          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          const edition = metadata.editions.find(e => e.seriesSlug === 'japan-game-awards' && e.year === 2026);
          if (!edition) throw new Error('Missing japan-game-awards 2026 metadata edition');
          edition.date = '2026-09-15';
          edition.status = 'completed';
          edition.venue = 'Hulic Hall Tokyo';
          edition.city = 'Tokio';
          edition.url = 'https://awards.cesa.or.jp/overview/';
          fs.writeFileSync(metadataPath, JSON.stringify(metadata, null, 2) + '\n');

          let prepare = fs.readFileSync(preparePath, 'utf8');

          const aliasNeedle = 'type CompanyDecision = { title: string; companySlug: string; role: "developer" | "publisher"; catalogId: string; url: string; note: string };';
          const aliasReplacement = aliasNeedle + '\n' +
            'type CurrentResultDecision = { series: string; year: number; title: string; categorySlug: string; categoryName: string; categoryType: AwardCategoryType; resultType: AwardResultType; url: string; recipientType: "game" | "other"; recipientKey?: string; retrievedAt: string; };';
          if (!prepare.includes(aliasNeedle)) throw new Error('Could not locate CompanyDecision type');
          prepare = prepare.replace(aliasNeedle, aliasReplacement);

          const seedNeedle = '  legacyPersonalResults: [string,string,number,string,string,string][];\n  otherResults: [string,number,string,string,string,AwardCategoryType,AwardResultType,string][];\n  generalLegacyIds: string[];';
          const seedReplacement = '  legacyPersonalResults: [string,string,number,string,string,string][];\n  otherResults: [string,number,string,string,string,AwardCategoryType,AwardResultType,string][];\n  currentResults?: CurrentResultDecision[];\n  generalLegacyIds: string[];';
          if (!prepare.includes(seedNeedle)) throw new Error('Could not locate seed result types');
          prepare = prepare.replace(seedNeedle, seedReplacement);

          const sourceNeedle = 'const source = (url: string, title: string, summary: string) => {';
          const sourceReplacement = 'const source = (url: string, title: string, summary: string, retrievedAt = seed.reviewedAt) => {';
          if (!prepare.includes(sourceNeedle)) throw new Error('Could not locate source helper');
          prepare = prepare.replace(sourceNeedle, sourceReplacement);
          prepare = prepare.replace(
            'if (!existing) research.sources.push({ id, url, title, retrievedAt: seed.reviewedAt, verifiedPrimary: true, evidenceSummary: summary });',
            'if (!existing) research.sources.push({ id, url, title, retrievedAt, verifiedPrimary: true, evidenceSummary: summary });'
          );

          const insertNeedle = 'for (const row of metadata.editions) {';
          const currentLoop = `for (const row of seed.currentResults ?? []) {\n  const series = research.series.find(s => s.slug === row.series)!; assert.ok(series);\n  const sourceId = source(row.url, \`${'${series.shortName}'} \${row.year}: \${row.categoryName}\`, \`Resultado oficial: \${row.title} — \${row.categoryName}.\`, row.retrievedAt);\n  const editionId = edition(row.series,row.year,sourceId,row.url);\n  const categoryId = \`${'${row.series}'}:\${row.categorySlug}\`;\n  if (!research.categories.some(c => c.id === categoryId)) research.categories.push({id:categoryId,seriesSlug:row.series,slug:row.categorySlug,canonicalName:row.categoryName,displayName:row.categoryName,categoryType:row.categoryType,prestigeGroup:"category_award",activeFrom:null,activeTo:null,previousNames:[],successorCategoryId:null,sourceIds:[sourceId]});\n  const id = \`${'${editionId}'}:\${row.categorySlug}:\${createHash("sha256").update(row.title).digest("hex").slice(0,10)}\`;\n  const recipient = row.recipientType === "other"\n    ? {type:"other" as const,key:row.recipientKey ?? row.title,displayName:row.title}\n    : {type:"game" as const,workKey:keys.get(row.title) ?? null,displayName:row.title};\n  research.results.push({id,editionId,seriesSlug:row.series,categoryId,resultType:row.resultType,officialLabel:row.categoryName,shared:false,recipients:[recipient],sourceIds:[sourceId],confidence:"HIGH",verificationStatus:"VERIFIED",publicationStatus:"published"});\n  approve("category",categoryId); approve("result",id);\n}\n`;
          if (!prepare.includes(insertNeedle)) throw new Error('Could not locate metadata editions loop');
          prepare = prepare.replace(insertNeedle, currentLoop + insertNeedle);

          fs.writeFileSync(preparePath, prepare);
          NODE

      - name: Regenerate deterministic award research and approvals
        run: npx tsx scripts/prepare-awards-v1.ts --write

      - name: Generate public award artifacts
        run: npm run awards:build

      - name: Verify reproducibility
        run: npm run awards:check

      - name: Award tests
        run: npm run test:awards

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck

      - name: Remove temporary workflow and commit verified update
        run: |
          rm .github/workflows/update-jga-2026.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "feat(awards): add Japan Game Awards 2026 results"
          git push origin HEAD:codex/japan-game-awards-2026
