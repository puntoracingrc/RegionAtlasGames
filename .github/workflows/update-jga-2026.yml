name: Update Japan Game Awards 2026

on:
  push:
    branches:
      - codex/japan-game-awards-2026
    paths:
      - .github/workflows/update-jga-2026.yml

permissions:
  contents: write

jobs:
  update-awards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/japan-game-awards-2026

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply official Japan Game Awards 2026 results
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const researchPath = 'data/research/award-study/research.json';
          const approvalsPath = 'data/research/award-editorial-approvals.json';
          const data = JSON.parse(fs.readFileSync(researchPath, 'utf8'));
          const approvals = JSON.parse(fs.readFileSync(approvalsPath, 'utf8'));

          const resultSourceId = 'AW-SRC-6373f4a332e5';
          const resultSource = {
            id: resultSourceId,
            url: 'https://awards.cesa.or.jp/year/prize/index.html',
            title: 'Japan Game Awards 2026: Games of the Year awarded works',
            retrievedAt: '2026-09-16',
            verifiedPrimary: true,
            evidenceSummary: 'Official CESA 2026 Games of the Year results: Grand Award, Game Designers Award, Awards for Excellence, Breakthrough Award, Movement Award and Special Award.'
          };

          const upsert = (rows, row) => {
            const i = rows.findIndex(x => x.id === row.id);
            if (i >= 0) rows[i] = row;
            else rows.push(row);
          };
          const uniq = values => [...new Set(values)];

          data.reviewedAt = '2026-09-16';
          upsert(data.sources, resultSource);

          const edition = data.editions.find(e => e.id === 'japan-game-awards:2026');
          if (!edition) throw new Error('Missing Japan Game Awards 2026 edition');
          edition.ceremonyDate = '2026-09-15';
          edition.venue = 'Hulic Hall Tokyo';
          edition.city = 'Tokio';
          edition.status = 'completed';
          edition.officialUrl = 'https://awards.cesa.or.jp/overview/';
          edition.sourceIds = uniq([...(edition.sourceIds || []), resultSourceId]);

          const categories = [
            {
              id: 'japan-game-awards:award-for-excellence',
              seriesSlug: 'japan-game-awards',
              slug: 'award-for-excellence',
              canonicalName: 'Award for Excellence',
              displayName: 'Award for Excellence',
              categoryType: 'other',
              prestigeGroup: 'category_award',
              activeFrom: null,
              activeTo: null,
              previousNames: [],
              successorCategoryId: null,
              sourceIds: [resultSourceId]
            },
            {
              id: 'japan-game-awards:game-designers-award',
              seriesSlug: 'japan-game-awards',
              slug: 'game-designers-award',
              canonicalName: 'Game Designers Award',
              displayName: 'Game Designers Award',
              categoryType: 'game_design',
              prestigeGroup: 'category_award',
              activeFrom: 2010,
              activeTo: null,
              previousNames: [],
              successorCategoryId: null,
              sourceIds: [resultSourceId]
            },
            {
              id: 'japan-game-awards:breakthrough-award',
              seriesSlug: 'japan-game-awards',
              slug: 'breakthrough-award',
              canonicalName: 'Breakthrough Award',
              displayName: 'Breakthrough Award',
              categoryType: 'innovation',
              prestigeGroup: 'category_award',
              activeFrom: 2024,
              activeTo: null,
              previousNames: [],
              successorCategoryId: null,
              sourceIds: [resultSourceId]
            },
            {
              id: 'japan-game-awards:movement-award',
              seriesSlug: 'japan-game-awards',
              slug: 'movement-award',
              canonicalName: 'Movement Award',
              displayName: 'Movement Award',
              categoryType: 'special',
              prestigeGroup: 'category_award',
              activeFrom: 2024,
              activeTo: null,
              previousNames: [],
              successorCategoryId: null,
              sourceIds: [resultSourceId]
            },
            {
              id: 'japan-game-awards:special-award',
              seriesSlug: 'japan-game-awards',
              slug: 'special-award',
              canonicalName: 'Special Award',
              displayName: 'Special Award',
              categoryType: 'special',
              prestigeGroup: 'category_award',
              activeFrom: null,
              activeTo: null,
              previousNames: [],
              successorCategoryId: null,
              sourceIds: [resultSourceId]
            }
          ];
          for (const category of categories) upsert(data.categories, category);

          const gameRecipient = displayName => ({ type: 'game', workKey: null, displayName });
          const baseResult = (id, categoryId, resultType, officialLabel, recipient) => ({
            id,
            editionId: 'japan-game-awards:2026',
            seriesSlug: 'japan-game-awards',
            categoryId,
            resultType,
            officialLabel,
            shared: false,
            recipients: [recipient],
            sourceIds: [resultSourceId],
            confidence: 'HIGH',
            verificationStatus: 'VERIFIED',
            publicationStatus: 'published'
          });

          const results = [
            baseResult('japan-game-awards:2026:grand-award:pokemon-pokopia', 'japan-game-awards:grand-award', 'winner', 'Grand Award', gameRecipient('Pokémon Pokopia')),
            baseResult('japan-game-awards:2026:game-designers-award:mojiyugi', 'japan-game-awards:game-designers-award', 'winner', 'Game Designers Award', gameRecipient('文字遊戯')),

            baseResult('japan-game-awards:2026:award-for-excellence:inazuma-eleven-victory-road', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('イナズマイレブン 英雄たちのヴィクトリーロード')),
            baseResult('japan-game-awards:2026:award-for-excellence:kirby-air-riders', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('カービィのエアライダー')),
            baseResult('japan-game-awards:2026:award-for-excellence:ghost-of-yotei', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('Ghost of Yōtei')),
            baseResult('japan-game-awards:2026:award-for-excellence:silent-hill-f', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('SILENT HILL f')),
            baseResult('japan-game-awards:2026:award-for-excellence:digimon-story-time-stranger', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('デジモンストーリー タイムストレンジャー')),
            baseResult('japan-game-awards:2026:award-for-excellence:death-stranding-2', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('DEATH STRANDING 2: ON THE BEACH')),
            baseResult('japan-game-awards:2026:award-for-excellence:donkey-kong-bananza', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('ドンキーコング バナンザ')),
            baseResult('japan-game-awards:2026:award-for-excellence:resident-evil-requiem', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('バイオハザード レクイエム')),
            baseResult('japan-game-awards:2026:award-for-excellence:paranormasight-file38', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('パラノマサイト FILE38 伊勢人魚物語')),
            baseResult('japan-game-awards:2026:award-for-excellence:pragmata', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('PRAGMATA')),
            baseResult('japan-game-awards:2026:award-for-excellence:pokemon-pokopia', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('Pokémon Pokopia')),
            baseResult('japan-game-awards:2026:award-for-excellence:maho-shojo-no-majo-saiban', 'japan-game-awards:award-for-excellence', 'recipient', 'Award for Excellence', gameRecipient('魔法少女ノ魔女裁判')),

            baseResult('japan-game-awards:2026:breakthrough-award:pragmata', 'japan-game-awards:breakthrough-award', 'winner', 'Breakthrough Award', gameRecipient('PRAGMATA')),
            baseResult('japan-game-awards:2026:movement-award:meccha-chameleon', 'japan-game-awards:movement-award', 'winner', 'Movement Award', gameRecipient('めっちゃカメレオン')),
            baseResult('japan-game-awards:2026:special-award:super-mario-galaxy-movie', 'japan-game-awards:special-award', 'special_recognition', 'Special Award', { type: 'other', key: 'the-super-mario-galaxy-movie', displayName: 'ザ・スーパーマリオギャラクシー・ムービー' })
          ];
          for (const result of results) upsert(data.results, result);

          fs.writeFileSync(researchPath, JSON.stringify(data, null, 2) + '\n');

          const researchHash = crypto.createHash('sha256').update(fs.readFileSync(researchPath)).digest('hex');
          approvals.researchHash = researchHash;
          const newApprovals = [
            ...categories.map(c => `category:${c.id}`),
            ...results.map(r => `result:${r.id}`)
          ];
          approvals.approved = uniq([...(approvals.approved || []), ...newApprovals]).sort();
          fs.writeFileSync(approvalsPath, JSON.stringify(approvals, null, 2) + '\n');
          NODE

      - name: Generate award public artifacts
        run: npm run awards:build

      - name: Verify reproducibility
        run: npm run awards:check

      - name: Award tests
        run: npm run test:awards

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck

      - name: Remove temporary workflow and commit verified update
        run: |
          rm .github/workflows/update-jga-2026.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "feat(awards): add Japan Game Awards 2026 results"
          git push origin HEAD:codex/japan-game-awards-2026
