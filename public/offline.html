<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Sin conexión | Region Atlas</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #64748b;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        background: #92400e;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #0b0d12;
          color: #f4f4f5;
        }
        p {
          color: #a1a1aa;
        }
        button {
          background: #fbbf24;
          color: #0b0d12;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.png" alt="" width="96" height="96" />
      <h1>Sin conexión</h1>
      <p>Region Atlas volverá a cargar cuando recuperes internet.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
